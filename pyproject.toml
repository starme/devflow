[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devflow"
version = "2.0.0"
description = "DevFlow — intent anchoring, independent verification and delivery gating for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".devflow", ".devflow-worktrees"]

[tool.ruff.format]
# core/rules/** ships rule documents whose fenced Python blocks are illustrative
# — formatting them rewrites published documentation for no behavioural gain.
exclude = ["core/rules/**"]

[tool.ruff.lint]
# Mirrors ~/.claude/rules/backend/python/code-style.md §11.
#
# Deliberately NOT selected:
#   S    (flake8-bandit) — its S110/S112 hits are the hooks' silent-fallback
#        contract: a guard hook must never block the user because its own audit
#        write failed.
#   BLE  (blind-except)  — same story at the hooks' outermost layer.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Exception names are part of the module's published API: renaming
# ``MigrationConflict`` / ``ArchiveMigrationConflict`` would break callers and
# their tests for a naming preference only.
"core/orchestrator/migration.py" = ["N818"]
"core/orchestrator/archive_migration.py" = ["N818"]
# Hook entry points are invoked directly by the harness, not imported, so an
# import-time side effect is the intended design rather than a smell.
"core/hooks/*.py" = ["E402"]
"hooks/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# NOTE: not strict yet. Enabling --strict surfaces 21 pre-existing errors and
# would require editing business logic; that is tracked as a separate task so
# this change stays a gate, not a refactor.
files = ["core/orchestrator", "core/project_analyzer.py", "hooks"]
