[project]
name = "devflow"
version = "2.4.0"
description = "DevFlow lifecycle orchestration plugin for Claude Code (commands, agents, hooks, YAML contracts)."
# Runtime floor is 3.9: hooks must run on the system python3 shipped with
# macOS/CI images (observed 3.9.6). The style guide's 3.10+ baseline applies
# to application code, not to this standard-library-only plugin runtime.
requires-python = ">=3.9"
# Runtime is standard-library only by design (hooks run under python3 -B -S).
dependencies = []

[project.optional-dependencies]
# Dev-only test runner. Not imported by any runtime code or hook.
# Pinned snapshot lives in requirements-dev.txt — keep the two in sync.
dev = ["pytest>=8,<9", "pytest-cov>=6,<7"]

[tool.ruff]
# Tests insert core/orchestrator on sys.path before importing local modules;
# E402 is inherent to that pattern (same as the pre-migration noqa markers).
[tool.ruff.lint.per-file-ignores]
"core/tests/*" = ["E402"]
"adapters/codex/tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "adapters/codex/tests"]
addopts = "-q"

# Coverage gate applies to the orchestration layer (the core business logic).
# Hooks are a fail-safe boundary layer whose defensive branches are inherently
# hard to cover (devflow_guard_common measured 56%); they are reported, not gated.
[tool.coverage.run]
source = ["core/orchestrator", "core/workspace.py", "core/project_analyzer.py"]
# keep artifacts inside the already-ignored .devflow/ tree (.gitignore is
# agent-protected, so this is the sanctioned way to avoid dirtying the tree)
data_file = ".devflow/.coverage"
[tool.coverage.report]
fail_under = 85
show_missing = false
omit = ["hooks/*", "core/hooks/*", "core/tests/*", "adapters/*"]
