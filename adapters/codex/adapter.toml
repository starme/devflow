platform = "codex"
version = "0.1"
capability = "soft"
core_root_env = "DEVFLOW_CORE_ROOT"
verified_extension_points = [
  "turn/start.skill_input",
  "mcp.tools",
  "mcp.tool_hooks.synchronous",
  "item.commandExecution.requestApproval",
]
unverified_extension_points = [
  "generic_pre_tool_use_file_write_deny",
  "github.pr_create",
  "git.push_branch",
]
commands = ["init", "start", "fix", "status", "next"]

# Delivery lifecycle capability (soft): commit/push are executed via host
# approval; PR creation is routed through the host and reported back as
# gh_pr_url. Codex does NOT claim a hard PR-creation capability.
[capabilities.delivery]
commit = "host_approval"
push = "host_approval"
pr_create = "router"
pr_url_key = "gh_pr_url"
