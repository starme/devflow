schema_version: 2

# One requirement or standalone bugfix per task worktree.
task:
  id: "{{TASK_ID}}"
  slug: "{{TASK_SLUG}}"
  title: "{{TASK_TITLE}}"
  kind: "{{TASK_KIND}}" # feature | bugfix | chore
  description: "{{TASK_DESCRIPTION}}"
  current_phase: "qa" # qa | prd_review | plan_review | working | deliver_confirm | done
  status: "active" # active | done (lifecycle flag; current_phase is the flow state)

git:
  base_ref: "{{BASE_REF}}"
  base_commit: "{{BASE_COMMIT}}"
  branch: "{{BRANCH}}"
  worktree: "{{WORKTREE}}"

# Optional traceability only; these fields do not create a dependency graph.
parent_task_id: null
source_task_id: null

artifacts:
  prd: null # .devflow/prd.md once written
  card: null # .devflow/card.md once written
  verification: null # .devflow/verification-report.md once written
  delivery: ".devflow/delivery.yaml"
