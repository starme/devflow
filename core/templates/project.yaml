schema_version: 1

# Project-level configuration. Workflow state belongs in task.yaml.
project:
  name: "{{PROJECT_NAME}}"
  created_at: "{{CREATED_AT}}"
  category:
    primary: null
    confidence: null
    ambiguous: false
    evidence: []
  capabilities: []

workspace:
  root: "{{PROJECT_ROOT}}"
  backend:
    path: null
    stack: null
  frontend:
    path: null
    stack: null
  contract_path: ".devflow/contracts"
  docs_path: "docs"
  rules_path: ".devflow/rules"

platforms:
  supported: [claude-code]
  default: "{{ADAPTER_NAME}}"

safety:
  redlines_path: ".devflow/redlines.yaml"
  test_file_protection: true

memorant:
  enabled: auto
  project_key: "{{PROJECT_NAME}}"

  # 各 Agent 的记忆权限
  agents:
    product:
      recall: true
      write: true
      write_types: [product_decision, scope_clarification]
    architect:
      recall: true
      write: true
      write_types: [adr, architecture_pattern]
    backend-dev:
      recall: true
      write: true
      write_types: [bug, snippet, backend_pattern]
    frontend-dev:
      recall: true
      write: true
      write_types: [bug, snippet, frontend_pattern]
    tester:
      recall: true
      write: true
      write_types: [test_experience, boundary_case, bug_pattern, product_contradiction]

  # Manager 派发前预测式召回
  pre_dispatch_recall:
    enabled: true
    max_results: 5
    trust_tier: verified

  # 写入设置
  write:
    default_trust_tier: provisional
    require_evidence: true
    dedup: true

  # 蒸馏设置
  distill:
    enabled: true
    auto_promote: true
    merge_duplicates: true
    deprecate_invalid: true

  # Memorant 不可用时的降级文件
  fallback_path: "docs/devflow-memories.md"
