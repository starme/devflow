# DevFlow Legacy Project Manifest（v1 兼容格式）
# ─────────────────────────────────────────────
# 新项目不要使用本格式：/devflow init 生成 project.yaml，任务状态写入每个 task 的
# task.yaml（v2，ADR-0005）。本模板仅为理解旧项目磁盘上的 .devflow/manifest.yaml
# 而保留——hooks 只在没有 task.yaml / project.yaml 时才回退读取它。
#
# v2 阶段值（六值）：qa | prd_review | plan_review | working | deliver_confirm | done
# 旧值读取时就近映射：gate_prd → prd_review；gate_arch / acceptance → plan_review；
# development / testing → working；其余 v1 阶段 → qa。
# v1 的角色 Agent（product/architect/backend-dev/frontend-dev/tester）已全部退役，
# 唯一 subagent 是 devflow-verifier。

project:
  name: "{{PROJECT_NAME}}"
  created_at: "{{CREATED_AT}}"
  # v2 six statuses; legacy projects may still hold v1 values (mapped on read).
  current_phase: "qa"
  work_type: null
  # null | feature | bugfix | chore
  initialized: true

  # Evidence-based repository classification (kept for legacy readers).
  category: null
  category_confidence: null
  category_ambiguous: false
  category_evidence: []
  capabilities: []

# ── 适配层信息 ──
adapter:
  name: "{{ADAPTER_NAME}}"             # claude-code | codex | cursor | trae
  capability: "{{ADAPTER_CAPABILITY}}"  # hard = PreToolUse 前置硬拦截；soft = 仅软约束 + 事后审计
  verified_capabilities: []

# ── 工作区路径约定 ──
workspace:
  root: "{{PROJECT_ROOT}}"
  backend:
    path: null
    stack: null
  frontend:
    path: null
    stack: null
  contract:
    path: ".devflow/contracts"
  docs:
    path: "docs"
  rules:
    path: ".devflow/rules"

# ── 产物索引 ──
artifacts:
  prd: null
  card: null
  verification: null
  delivery: ".devflow/delivery.yaml"

# ── Memorant 记忆配置（v2：主线程统一调用，无按 Agent 权限矩阵）──
memorant:
  enabled: auto
  project_key: "{{PROJECT_NAME}}"
  recall:
    max_results: 5
    trust_tier: verified
  write:
    default_trust_tier: provisional
    require_evidence: true
    dedup: true
  distill:
    enabled: true
    auto_promote: true
